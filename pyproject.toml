[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dispropy"
version = "0.3.0"
description = "Python library for disproportionality analysis in pharmacovigilance"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Bruno Ramalho" }]
license = "MIT"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
